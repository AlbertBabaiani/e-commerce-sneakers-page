<header
  app-navbar
  [cartQuantity]="selectedProductsQuantity()"
  (toggleCart)="toggleCartView()"
></header>

<main>
  <section app-image-carousel class="img-carousel" [product]="selectedProduct()"></section>

  <section
    app-product-content
    [product]="selectedProduct()"
    (newProduct)="addProduct($event)"
    class="content"
  ></section>

  @if (cartShowed()) {
    <div class="cart-overlay" (click)="toggleCartView()"></div>

    <app-cart [cart]="cart()" (deleteProduct)="deleteProduct($event)" />
  }
</main>
